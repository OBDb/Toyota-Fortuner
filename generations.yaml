generations:
  - name: "First Generation (AN50/AN60)"
    start_year: 2005
    end_year: 2008
    description: "The first-generation Toyota Fortuner was developed as a mid-size SUV based on the Hilux pickup truck platform, targeting emerging markets across Asia, the Middle East, South America, and Australia (where it was initially known as the HiLux SW4). Featuring traditional body-on-frame construction with a design that emphasized ruggedness and utility, the Fortuner offered three rows of seating for up to seven passengers and genuine off-road capability, distinguishing it from the more car-like crossovers that were becoming increasingly common. Powertrain options varied by market but typically included a range of diesel and gasoline engines, with the most common being 2.5-liter and 3.0-liter turbo-diesel four-cylinders, and a 2.7-liter gasoline option, paired with manual or automatic transmissions. All variants featured selectable four-wheel drive with a low-range transfer case for off-road use. The interior prioritized durability and practicality over luxury, though higher trim levels offered features like leather seating, climate control, and upgraded audio systems. This original version established the Fortuner's reputation for rugged reliability."

  - name: "First Generation (AN50/AN60) - First Facelift"
    start_year: 2008
    end_year: 2011
    description: "The first facelift of the Toyota Fortuner was launched in July 2008, featuring updated projector headlamps and grille, new rear lights with LED elements, Bluetooth connectivity, and a new light sand interior color. The 4×4 V model received an electronic adjustable driver's seat, and the rear air conditioning was relocated from the sides to the ceiling for second and third row passengers. Electronic Brake Force Distribution with Brake Assist was introduced on select models. This facelift also marked the introduction of variable nozzle turbocharger (VNT) technology on the 2.5-liter diesel engine, improving power output by approximately 60% while reducing fuel consumption by up to 30%."

  - name: "First Generation (AN50/AN60) - Second Facelift"
    start_year: 2011
    end_year: 2015
    description: "The second facelift of the Toyota Fortuner was introduced in July 2011, bringing a comprehensive exterior redesign with a new front fascia, fender, hood, grille, headlamps, tail lamps, bumper, and fog light housing, styling cues similar to the J200 Land Cruiser. The rear bumper and garnish plate were also revised. Side changes included new sharper fender flares, LED-integrated side view mirrors, and redesigned wheels similar to the 2012 Hilux. Interior upgrades included a new center console, steering wheel, and upgraded audio/video system. The VNT (Variable Nozzle Turbo) intercooled engine became standard across the range, further improving performance and efficiency. This facelift version continued production until December 2015."

  - name: "Second Generation (AN150/AN160)"
    start_year: 2015
    end_year: 2020
    description: "The second-generation Toyota Fortuner was unveiled simultaneously on 16 July 2015 in Australia and Thailand. Developed under executive chief engineer Hiroki Nakajima, it features the 'Keen Look' design language shared with the new Hilux. While sharing bonnet panels, front pillar area, windscreen glass, and front doors with the Hilux, the Fortuner has a more slim-looking exterior with slim headlights featuring bi-beam LED projector options and blacked-out D-pillars for a 'floating roof' look. Toyota designers drew inspiration from the Land Cruiser and Land Cruiser Prado heritage to differentiate the Fortuner from competitors. The interior no longer shares design with the Hilux, featuring an upright dashboard with synthetic leather trims, a three-spoke steering wheel, and a modern instrument cluster with a large color TFT LCD multi-info display. Powertrains include newly developed GD series diesel engines (2.4L and 2.8L), updated 2.7L and 4.0L petrol engines with Dual VVT-i, paired with six-speed manual or automatic transmissions. The body-on-frame construction features larger cross-section ladder frame, double wishbone front suspension, and five-link rear suspension with coil springs. A part-time 4×4 system replaced the full-time system of the previous generation."

  - name: "Second Generation (AN150/AN160) - Facelift"
    start_year: 2020
    end_year: null
    description: "The facelifted second-generation Toyota Fortuner debuted in June 2020 for the Thai market alongside the facelifted Hilux. The Legender flagship sub-model (known as VRZ in Indonesia and Malaysia, LTD in the Philippines, Diamond in South America, and Black Onyx in Russia) was introduced to replace the TRD Sportivo model. The Legender grade features different headlight units, unique front and rear bumper designs aligned with Toyota crossover SUVs, 20-inch wheels, interior ambient lighting, two-tone leather seats, JBL sound system, and Toyota Safety Sense active safety systems. The 2.8-liter 1GD-FTV diesel engine received an upgrade, producing increased power and torque. The Legender-based GR Sport variant was launched in August 2021, offering sportier styling and features. Additional updates across markets include improved safety features, updated infotainment systems with wireless smartphone connectivity, and in some regions, the introduction of 48V mild hybrid technology on the 2.8-liter diesel engine."